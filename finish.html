<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a2a2a">
  <title>FIREHELM — Einsatz beendet</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main class="page">
    <header class="brand-header">
      <img src="assets/icons/logo.svg" alt="" class="brand-header__logo">
      <div class="brand-header__wordmark"><span class="fire">FIRE</span><span class="helm">HELM</span></div>
    </header>

    <section class="finish">
      <h1 class="finish__title">Einsatz<br>beendet!</h1>
      <div class="finish__trophy">🏆</div>
      <div class="finish__label">FINALE ZEIT</div>
      <div class="finish__time" id="final-time">0:00</div>
      <div class="finish__label">PLATZIERUNG</div>
      <div class="finish__rank" id="final-rank">#—</div>
      <button class="btn-primary" onclick="location.href='index.html'">Zurück zum<br>Startbildschirm</button>
    </section>
  </main>
  <script type="module" src="js/finish.js"></script>
</body>
</html>
